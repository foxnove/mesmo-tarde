name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar Testes Automatizados
        run: |
          node --test test/chords.test.mjs
          node --test test/agenda.test.mjs
          node --test test/github-access.test.mjs
          node --test test/autoscroll.test.mjs
          node --test test/autoscroll-page.test.mjs
          node --test home/links.test.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Empacotar Artefato para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
        continue-on-error: true

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
